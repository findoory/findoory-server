<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>핀도리 도감</title>
</head>

<body>

<h1>🌱 나의 핀도리 도감</h1>

<div id="cards"></div>


<script>

const kakao_id =
new URLSearchParams(location.search).get("id");


fetch(`/collection/${kakao_id}`)
.then(res=>res.json())
.then(data=>{


    const box=document.getElementById("cards");

    if(data.length === 0){

        box.innerHTML = `
        <p>아직 획득한 카드가 없습니다.</p>
        <p>매일 퀘스트와 퀴즈를 완료해서 카드를 모아보세요!</p>
        `;

        return;

    }


    data.forEach(card=>{

        box.innerHTML += `

        <div>

        <img src="${card.image_url}" width="200">

        <h2>${card.name}</h2>

        <p>${card.description}</p>

        </div>

        `;

    });

});

</script>

</body>
</html>
