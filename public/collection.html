<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나의 핀도리 도감</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="book">

    <header>
        <h1>🌱 Findoory</h1>

        <h2>나의 핀도리 도감</h2>

        <p>
            의뢰를 해결하며 모은 소중한 카드
        </p>
    </header>

    <main>
        <section id="cards" class="collection">
            <div class="state-box">
                <div class="state-icon">📖</div>
                <p>도감을 불러오고 있어요...</p>
            </div>
        </section>
    </main>

</div>

<script>
const cardsArea = document.getElementById("cards");

const kakao_id =
    new URLSearchParams(location.search).get("id");

function showMessage(icon, title, message) {
    cardsArea.innerHTML = `
        <div class="state-box">
            <div class="state-icon">${icon}</div>
            <h2>${title}</h2>
            <p>${message}</p>
        </div>
    `;
}

if (!kakao_id) {
    showMessage(
        "🔍",
        "사용자 정보를 찾을 수 없어요",
        "카카오톡에서 도감 보기 버튼을 다시 눌러주세요."
    );
} else {
    fetch(`/collection/${encodeURIComponent(kakao_id)}`)
        .then(response => {
            if (!response.ok) {
                throw new Error("도감 요청에 실패했습니다.");
            }

            return response.json();
        })
        .then(cards => {
            if (!Array.isArray(cards) || cards.length === 0) {
                showMessage(
                    "🌱",
                    "아직 획득한 카드가 없어요",
                    "매일 퀘스트와 퀴즈를 완료해서 카드를 모아보세요!"
                );

                return;
            }

            cardsArea.innerHTML = "";

            cards.forEach(card => {
                const cardElement = document.createElement("article");
                cardElement.className = "card";

                const image = document.createElement("img");
                image.src = card.image_url;
                image.alt = `${card.name || "핀도리"} 카드`;
                image.loading = "lazy";

                const cardLabel = document.createElement("span");
                cardLabel.className = "card-label";
                cardLabel.textContent = "✨ 의뢰 해결 완료";

                const cardName = document.createElement("h2");
                cardName.textContent = `🐢 ${card.name || "이름 없는 카드"}`;

                const description = document.createElement("p");
                description.className = "description";
                description.textContent =
                    card.description || "카드 설명이 아직 준비되지 않았어요.";

                cardElement.append(
                    image,
                    cardLabel,
                    cardName,
                    description
                );

                cardsArea.appendChild(cardElement);
            });
        })
        .catch(error => {
            console.error(error);

            showMessage(
                "☁️",
                "도감을 불러오지 못했어요",
                "잠시 후 다시 시도해주세요."
            );
        });
}
</script>

</body>
</html>
